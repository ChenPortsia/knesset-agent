# Question bank v1: what get_context must find for each question.
#
# `needs` lists the context items an analyst would need to answer correctly. It was written
# before running the search, from the question alone, so the test is honest.
# Rules marked `always: true` in knesset_data reach the agent on every question and are
# only listed here when the question is about them.
# Test it: make eval-context

- question: כמה הצעות חוק פרטיות עברו בכנסת ה-25?
  needs: [table.dim_bill, glossary.private_bill, rule.passed_means_third_reading, vq.bills_by_origin_25th_knesset]

- question: What share of government bills become law?
  needs: [metric.bill_pass_rate, glossary.government_bill, table.dim_bill]

- question: מי המורדים הגדולים בליכוד?
  needs: [alias.party.likud, glossary.faction_discipline, metric.faction_loyalty_rate, table.fct_vote_result]

- question: כמה פעמים הצביע בן גביר נגד הקואליציה?
  needs: [alias.person.ben_gvir, table.fct_vote_result, rule.camp_at_the_time, glossary.coalition]

- question: How often did Netanyahu show up to vote in the 25th Knesset?
  needs: [alias.person.netanyahu, metric.attendance_rate, table.fct_vote_result]

- question: כמה ישיבות קיימה ועדת הכספים השנה?
  needs: [alias.committee.finance, table.fct_committee_session, metric.committee_sessions, rule.committee_across_knessets]

- question: Which committee worked the most hours last year?
  needs: [metric.committee_hours, table.fct_committee_session, table.dim_committee]

- question: אילו שרים לא עונים על שאילתות?
  needs: [glossary.parliamentary_query, metric.query_reply_rate, table.fct_query, vq.queries_by_ministry_24th_knesset]

- question: How long does the Health Ministry take to answer queries?
  needs: [metric.average_query_reply_days, table.fct_query, table.dim_ministry, glossary.parliamentary_query]

- question: האם האופוזיציה מגישה יותר שאילתות מהקואליציה?
  needs: [vq.queries_by_camp, table.fct_query, rule.camp_at_the_time]

- question: Which bills passed their preliminary reading but never reached a first reading?
